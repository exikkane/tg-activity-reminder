services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BOT_HTTP_PORT:-8080}:8080"
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
volumes:
  bot-data:
