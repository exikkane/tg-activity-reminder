[project]
name = "youtrack-time-bot"
version = "0.1.0"
description = "Telegram time entry for YouTrack"
requires-python = ">=3.12"
dependencies = ["aiogram[proxy]>=3.20,<4", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=43", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
